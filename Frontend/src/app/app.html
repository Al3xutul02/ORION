<app-command-bar />

<main>
  <router-outlet />
</main>

<div class="toasts no-print" aria-live="polite">
  @for (t of store.toasts(); track t.id) {
    <div class="toast {{ t.level }}" role="status">
      <div>
        <strong>{{ t.title }}</strong>
        <p>{{ t.body }}</p>
      </div>
      <button type="button" class="close" aria-label="Dismiss" (click)="store.dismissToast(t.id)">×</button>
    </div>
  }
</div>

<footer class="disclaimer no-print">
  Simulated, fictional theatre · Defensive use only: protects own drones · Only safe, reversible actions · The operator decides
</footer>
